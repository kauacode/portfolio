<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("{{FONT}}") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #ffffff; color: #121112; font-family: "Archivo", Arial, sans-serif; position: relative; }
  .txt { position: absolute; left: 72px; top: 70px; width: 720px; z-index: 3; }
  .title { font-stretch: 86%; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 26px; display: flex; align-items: center; gap: 14px; }
  .title i { width: 16px; height: 16px; border-radius: 50%; background: #0c7c43; display: block; }
  h1 { margin: 26px 0 0; font-weight: 900; font-stretch: 125%; font-size: 116px; line-height: .86; letter-spacing: -.035em; text-transform: uppercase; }
  .line { margin-top: 34px; font-size: 34px; font-weight: 600; font-stretch: 108%; }
  .foot { position: absolute; left: 72px; bottom: 60px; font-size: 24px; font-weight: 600; font-stretch: 100%; color: #3b383d; z-index: 3; }
  .ph { position: absolute; right: 90px; top: 64px; width: 340px; height: 470px; border-radius: 999px 999px 0 0; overflow: hidden; z-index: 2; }
  .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
  .s { position: absolute; display: block; }
  .ochre { width: 120px; height: 66px; background: #d39a26; border-radius: 100% 0; right: 380px; top: 86px; z-index: 1; }
  .green { width: 170px; height: 170px; background: #0c7c43; border-radius: 0 0 0 100%; right: 360px; top: 300px; z-index: 1; }
  .purple { width: 78px; height: 220px; background: #4b2b85; border-radius: 999px; right: 46px; top: 210px; z-index: 3; }
  .blue { height: 96px; left: 690px; right: 0; bottom: 0; background: #2a8bd0; z-index: 3; }
</style>
</head>
<body>
  <div class="txt">
    <div class="title"><i></i><span id="t"></span></div>
    <h1>Kauã<br>Braccio</h1>
    <div class="line" id="l"></div>
  </div>
  <div class="foot" id="f"></div>
  <span class="s ochre"></span><span class="s green"></span>
  <div class="ph"><img src="{{PHOTO}}" alt=""></div>
  <span class="s purple"></span><span class="s blue"></span>
  <script>
    const d = {{DATA}};
    document.getElementById("t").textContent = d.title;
    document.getElementById("l").textContent = d.line;
    document.getElementById("f").textContent = d.foot;
  </script>
</body>
</html>
