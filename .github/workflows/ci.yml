name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, tipos e formatação
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
      - name: Testes unitários
        run: npm test
      - name: Build (pré-renderização)
        run: npm run build
      - name: Testes da saída
        run: npm run test:dist
